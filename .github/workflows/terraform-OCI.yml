name: Terraform OCI Workflow

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Create OCI private key file
        run: |
          echo "${{ secrets.PRIVATEKEY }}" > APIPrivateKey.pem
          chmod 600 APIPrivateKey.pem

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var "tenancyocid=${{ secrets.TENANCYOCID }}" \
            -var "userocid=${{ secrets.USEROCID }}" \
            -var "finger_print=${{ secrets.FINGER_PRINT }}" \
            -var "privatekeypath=APIPrivateKey.pem"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve \
            -var "tenancyocid=${{ secrets.TENANCYOCID }}" \
            -var "userocid=${{ secrets.USEROCID }}" \
            -var "finger_print=${{ secrets.FINGER_PRINT }}" \
            -var "privatekeypath=APIPrivateKey.pem"

